[project]
name = "fusion-export"
version = "0.1.0"  # must match FusionExport/FusionExport.manifest; checked by scripts/check-version.sh
description = "Fusion add-in: bulk export of designs and drawings"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
